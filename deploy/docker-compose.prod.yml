version: '3.8'

services:
  # Database Service
  db:
    image: postgres:15-alpine
    container_name: fxtao_db
    restart: always
    env_file:
      - .env
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fxtao_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d fxtao_db" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API Service
  api:
    build:
      context: ../
      dockerfile: deploy/backend.Dockerfile
    container_name: fxtao
    restart: always
    env_file:
      - .env
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy
    networks:
      - fxtao_network

  # Frontend Service (Production Build)
  web:
    build:
      context: ../
      dockerfile: deploy/frontend.prod.Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: fxtao_web
    restart: always
    ports:
      - '8080:80'
    depends_on:
      - api
    networks:
      - fxtao_network

volumes:
  postgres_data:


networks:
  fxtao_network:
    driver: bridge
