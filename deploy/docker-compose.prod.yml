services:
  # Database Service
  db:
    image: postgres:15-alpine
    container_name: fxtao_db
    restart: always
    init: true
    stop_grace_period: 60s
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fxtao_network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d fxtao_db" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API Service
  api:
    build:
      context: ../
      dockerfile: deploy/backend.Dockerfile
    container_name: fxtao
    restart: always
    init: true
    user: "node"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      DATABASE_URL: ${DATABASE_URL}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      FRONTEND_URL: ${FRONTEND_URL}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-${FRONTEND_URL}}
      REQUEST_BODY_LIMIT: ${REQUEST_BODY_LIMIT:-10mb}
      RATE_LIMIT_WINDOW_MINUTES: ${RATE_LIMIT_WINDOW_MINUTES:-15}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-600}
      AUTH_RATE_LIMIT_WINDOW_MINUTES: ${AUTH_RATE_LIMIT_WINDOW_MINUTES:-15}
      AUTH_RATE_LIMIT_MAX_REQUESTS: ${AUTH_RATE_LIMIT_MAX_REQUESTS:-30}
      UPLOAD_RATE_LIMIT_WINDOW_MINUTES: ${UPLOAD_RATE_LIMIT_WINDOW_MINUTES:-60}
      UPLOAD_RATE_LIMIT_MAX_REQUESTS: ${UPLOAD_RATE_LIMIT_MAX_REQUESTS:-40}
      UPLOAD_MAX_FILE_SIZE_MB: ${UPLOAD_MAX_FILE_SIZE_MB:-10}
      ENFORCE_PRODUCTION_SECURITY: ${ENFORCE_PRODUCTION_SECURITY:-true}
      JWT_SECRET: ${JWT_SECRET}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET}
      MICROSOFT_REDIRECT_URI: ${MICROSOFT_REDIRECT_URI}
      MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID}
      SHAREPOINT_API_AUDIENCE: ${SHAREPOINT_API_AUDIENCE:-}
      SHAREPOINT_REQUIRED_SCOPE: ${SHAREPOINT_REQUIRED_SCOPE:-access_as_user}
      SHAREPOINT_ALLOWED_CLIENT_IDS: ${SHAREPOINT_ALLOWED_CLIENT_IDS:-}
      SAAS_DEFAULT_TENANT_SLUG: ${SAAS_DEFAULT_TENANT_SLUG:-engetec}
      SAAS_DEFAULT_TENANT_NAME: ${SAAS_DEFAULT_TENANT_NAME:-Engetec}
      SAAS_DEFAULT_TENANT_LEGAL_NAME: ${SAAS_DEFAULT_TENANT_LEGAL_NAME:-Engetec}
      SAAS_DEFAULT_TENANT_DOMAIN: ${SAAS_DEFAULT_TENANT_DOMAIN:-}
      SAAS_DEFAULT_DATABASE_LABEL: ${SAAS_DEFAULT_DATABASE_LABEL:-tenant-engetec}
      SAAS_DEFAULT_PLAN_CODE: ${SAAS_DEFAULT_PLAN_CODE:-enterprise}
      SAAS_DEFAULT_LOCAL_LOGIN_ENABLED: ${SAAS_DEFAULT_LOCAL_LOGIN_ENABLED:-true}
      SAAS_DEFAULT_MICROSOFT_LOGIN_ENABLED: ${SAAS_DEFAULT_MICROSOFT_LOGIN_ENABLED:-false}
      PORT: ${PORT}
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      db:
        condition: service_healthy
    networks:
      - fxtao_network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Frontend Service (Production Build)
  web:
    build:
      context: ../
      dockerfile: deploy/frontend.prod.Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_ENABLE_MICROSOFT_LOGIN: ${VITE_ENABLE_MICROSOFT_LOGIN:-true}
    container_name: fxtao_web
    restart: always
    init: true
    security_opt:
      - no-new-privileges:true
    ports:
      - '127.0.0.1:8080:80'
    depends_on:
      - api
    networks:
      - fxtao_network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:


networks:
  fxtao_network:
    driver: bridge
