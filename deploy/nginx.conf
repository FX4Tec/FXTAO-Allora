log_format sanitized '$remote_addr - $remote_user [$time_local] '
                     '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                     '"$http_user_agent"';

server {
    listen 80;
    server_tokens off;
    access_log /var/log/nginx/access.log sanitized;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https:; form-action 'self' https://login.microsoftonline.com;" always;

    location ^~ /.well-known/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
    }

    location ~ /\.(?!well-known) {
        return 404;
    }

    location ~* \.(php|asp|aspx|jsp|cgi|pl|py|sh)$ {
        return 404;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
