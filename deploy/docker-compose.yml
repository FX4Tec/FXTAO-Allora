version: '3.8'

services:
  # Database Service
  db:
    image: postgres:15-alpine
    container_name: fxtao_db
    restart: always
    init: true
    stop_grace_period: 60s
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fxtao_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d fxtao_db" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API Service (Named 'fxtao' as requested)
  api:
    build:
      context: ../
      dockerfile: deploy/backend.Dockerfile
    container_name: fxtao
    restart: always
    init: true
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      db:
        condition: service_healthy
    networks:
      - fxtao_network

  # Frontend Service
  web:
    build:
      context: ../
      dockerfile: deploy/frontend.Dockerfile
    container_name: fxtao_web
    restart: always
    init: true
    security_opt:
      - no-new-privileges:true
    ports:
      - '127.0.0.1:8080:80'
    depends_on:
      - api
    networks:
      - fxtao_network

volumes:
  postgres_data:


networks:
  fxtao_network:
    driver: bridge
